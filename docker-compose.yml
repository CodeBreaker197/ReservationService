services:
  postgres:
    image: postgres:16-alpine
    container_name: reservation-service-postgres
    environment:
      POSTGRES_DB: reservation_service
      POSTGRES_USER: reservation_user
      POSTGRES_PASSWORD: reservation_password
    ports:
      - "5432:5432"
    volumes:
      - reservation_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservation_user -d reservation_service"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  reservation_postgres_data:
